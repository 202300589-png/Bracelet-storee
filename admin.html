<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم Bracelet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Gilda+Display&display=swap">
<style>
:root{
  --bg:#ECE9E3; --card:#F7F5F1; --ink:#0E1A33; --mute:#5A6378; --line:#D5D0C6;
  --gold:#9A7424; --btn-bg:#0E1A33; --btn-fg:#F7F5F1; --ok:#1F7A4D; --bad:#B3261E;
  --display:'Gilda Display',Georgia,serif; --body:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1426; --card:#121D35; --ink:#EDE8DC; --mute:#9EA8BE; --line:#26334F;
  --gold:#D2AE5C; --btn-bg:#D2AE5C; --btn-fg:#0B1426; --ok:#5CC590; --bad:#FF8A80; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-weight:400}

/* buttons and fields */
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:6px;padding:9px 20px;font-weight:600}
.btn[disabled]{opacity:.4;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 14px}
.ghost:hover{border-color:var(--ink)}
.danger{color:var(--bad);border-color:var(--bad)}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
textarea{min-height:76px;resize:vertical}
.ltr{direction:ltr;text-align:left}
.hint{font-size:13px;color:var(--mute);margin:4px 0 0}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.box{width:min(380px,100%);display:grid;gap:12px}
.box h1{font-size:34px;margin:0;text-align:center}
.box p{margin:0;color:var(--mute);text-align:center}
.err{color:var(--bad);min-height:1.5em;font-size:14px}

/* app */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar .in{max-width:960px;margin-inline:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .brand{font-size:20px;margin-inline-end:auto}
.state{font-size:14px;color:var(--mute)}
.state.dirty{color:var(--gold);font-weight:600}
main{max-width:960px;margin-inline:auto;padding-block:20px 80px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 18px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{margin:0;font-size:20px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14px;color:var(--mute);margin-bottom:14px}

/* product rows */
#plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.prow{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.prow .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumb{width:68px;height:68px;border-radius:4px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:11px;color:var(--mute);flex:none}
.meta{flex:1 1 160px;min-width:0}
.meta strong{display:block;overflow-wrap:anywhere}
.meta .sub{font-size:14px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.flags{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.flags label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .ghost{padding:5px 12px;font-size:14px}
.form{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.f.wide{grid-column:1/-1}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn{display:inline-block;cursor:pointer;color:var(--ink)}
.gal{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gi{display:grid;gap:6px;justify-items:center;width:104px}
.gi .gthumb{width:104px;height:104px;border-radius:6px;object-fit:cover;background:var(--line)}
.gi .ghost{padding:3px 8px;font-size:12px;width:100%}
.gi .main{font-size:12px;color:var(--gold);font-weight:600;padding:3px 0}
.perk{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.panel h3{grid-column:1/-1;margin:6px 0 0;font-size:16px}
.panel h3:first-child{margin-top:0}
.imgblock{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgblock .thumb{width:110px;height:110px}

/* categories, shipping, payments tabs */
.stack{display:grid;gap:18px}
.rows{display:grid;gap:8px}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.r .nm{flex:1 1 150px;min-width:0}
.r input[type=number]{width:110px}
.r .cb{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.r .hint{margin:0}
.gov .nm b{display:block;font-weight:600}
.gov .nm span{display:block;font-size:13px;color:var(--mute);direction:ltr;text-align:right}
.payc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.payc .top{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:600}
.payc .top label{margin:0;color:var(--ink)}
.gold{color:var(--gold)}
s{color:var(--mute)}

/* appearance tab */
.look{display:grid;gap:18px}
.group{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.group h3{margin:0 0 4px;font-size:16px}
.group .hint{margin:0 0 12px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dots{display:flex}
.dots i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.5);margin-inline-start:-5px}
.dots i:first-child{margin-inline-start:0}
.fontopt{flex-direction:column;align-items:flex-start;gap:2px;min-width:140px;text-align:start}
.fontopt .s1{font-size:22px;line-height:1.2;direction:ltr}
.fontopt .s2{font-size:13px;color:var(--mute);direction:ltr}
.colors{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.colors .c{display:flex;align-items:center;gap:12px}
.colors input[type=color]{width:46px;height:46px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;flex:none;cursor:pointer}
.colors label{margin:0;color:var(--ink)}
.colors small{display:block;color:var(--mute);font-size:12px}
/* live preview (its colors come from the chosen theme, set inline) */
.pv{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:var(--body);direction:ltr;text-align:left}
.pv-bar{padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:var(--dw);letter-spacing:.3em;text-transform:uppercase}
.pv-body{padding:16px 14px 18px}
.pv small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.pv h4{font-family:var(--display);font-weight:var(--dw);font-size:28px;line-height:1.1;margin:4px 0 6px}
.pv p{margin:0 0 12px;font-size:13px;color:var(--mute);max-width:40ch}
.pv-btn{display:inline-block;background:var(--btn-bg);color:var(--btn-fg);border-radius:var(--radius);padding:7px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.pv-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pv-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius);background:var(--card)}
.pv-card span{display:block;font-size:11px;margin-top:4px}
.pv-card b{font-weight:500;color:var(--gold);font-size:11px}

#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:100%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="data/theme.js"></script>
<script src="data/egypt.js"></script>
<script src="data/default-store.js"></script>
</head>
<body>

<div id="login" class="login">
  <form id="loginForm" class="box">
    <h1 class="brand">Bracelet</h1>
    <p>لوحة التحكم في المتجر</p>
    <div>
      <label for="pw">كلمة السر</label>
      <input id="pw" type="password" class="ltr" autocomplete="current-password" required>
    </div>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" type="submit" id="loginBtn">دخول</button>
  </form>
</div>

<div id="app" hidden>
  <div class="bar"><div class="in">
    <span class="brand">Bracelet</span>
    <span class="state" id="state" role="status"></span>
    <a class="ghost" href="/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">عرض الموقع</a>
    <button class="btn" id="save" type="button" disabled>حفظ التعديلات</button>
    <button class="ghost" id="logout" type="button">خروج</button>
  </div></div>

  <main>
    <div class="tabs" role="group" aria-label="الأقسام">
      <button type="button" id="tabP" aria-pressed="true">المنتجات</button>
      <button type="button" id="tabD" aria-pressed="false">الأقسام والخصومات</button>
      <button type="button" id="tabH" aria-pressed="false">الشحن والدفع</button>
      <button type="button" id="tabL" aria-pressed="false">الشكل والألوان</button>
      <button type="button" id="tabS" aria-pressed="false">إعدادات المتجر</button>
    </div>
    <div class="banner" id="banner" hidden>لسه ما حفظتش أي تعديل. اللي قدامك هي البيانات الأصلية للموقع، وأول ما تدوس حفظ هتبقى هي المعتمدة.</div>

    <section id="viewP">
      <div class="sec-head"><h2>المنتجات</h2><button class="btn" type="button" id="addP">+ منتج جديد</button></div>
      <ul id="plist"></ul>
    </section>

    <section id="viewD" hidden>
      <div class="sec-head"><h2>الأقسام والخصومات</h2></div>
      <div class="stack" id="cats"></div>
    </section>

    <section id="viewH" hidden>
      <div class="sec-head"><h2>الشحن والدفع</h2></div>
      <div class="stack" id="ship"></div>
    </section>

    <section id="viewL" hidden>
      <div class="sec-head"><h2>الشكل والألوان</h2></div>
      <div class="look" id="look"></div>
    </section>

    <section id="viewS" hidden>
      <div class="sec-head"><h2>إعدادات المتجر</h2></div>
      <div class="panel" id="settings"></div>
    </section>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var src=function(u){return /^img\//.test(u)?"/"+u:u};
  var DEF=window.DEFAULT_STORE, MAXIMG=8;
  var pw="",data=null,dirty=false,openId=null,tab="products",delId=null,toastT=null;
  try{pw=sessionStorage.getItem("bracelet-admin")||""}catch(e){}

  /* ---------- helpers ---------- */
  function toast(msg,bad){var t=$("toast");t.textContent=msg;t.className="on"+(bad?" bad":"");clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},3800)}
  function api(path,body){
    return fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","x-admin-password":pw},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {status:r.status,body:j}})});
  }
  function setDirty(v){dirty=v;$("save").disabled=!v;var s=$("state");s.textContent=v?"فيه تعديلات لسه ما اتحفظتش":"كل حاجة محفوظة";s.className="state"+(v?" dirty":"")}
  function backToLogin(msg){$("app").hidden=true;$("login").hidden=false;$("loginErr").textContent=msg||"";$("pw").focus();try{sessionStorage.removeItem("bracelet-admin")}catch(e){}}
  function imgs(p){return p.images||(p.images=p.image?[p.image]:[])}

  /* ---------- login ---------- */
  function login(pass){
    pw=pass;
    return api("/api/login",{}).then(function(r){
      if(r.status===200){try{sessionStorage.setItem("bracelet-admin",pw)}catch(e){}return true}
      if(r.status===503)throw new Error("لسه ما حطيتش كلمة السر في إعدادات Vercel (ADMIN_PASSWORD). اتبع خطوات التفعيل وجرّب تاني.");
      if(r.status===401)throw new Error("كلمة السر غلط.");
      throw new Error("اللوحة مش شغالة على الرابط ده. لازم تكون مرفوعة على Vercel ومعاها فولدر api.");
    });
  }
  $("loginForm").addEventListener("submit",function(e){
    e.preventDefault();$("loginErr").textContent="";$("loginBtn").disabled=true;
    login($("pw").value).then(enter).catch(function(err){$("loginErr").textContent=err.message}).then(function(){$("loginBtn").disabled=false});
  });

  function enter(){
    return fetch("/api/store?fresh=1",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(d){
      var saved=d&&d.store&&Array.isArray(d.products);
      data=JSON.parse(JSON.stringify(saved?{store:Object.assign({},DEF.store,d.store),products:d.products}:DEF));
      var st=data.store;
      st.theme=Theme.normalize(st.theme);
      data.products.forEach(function(p){imgs(p);p.salePrice=Number(p.salePrice)||0});
      st.announcement=st.announcement||"";st.freeShippingOver=Number(st.freeShippingOver)||0;
      st.shipping=Object.assign({},DEF.store.shipping,st.shipping||{});
      st.payments=DEF.store.payments.map(function(dp){return Object.assign({},dp,(Array.isArray(st.payments)?st.payments:[]).filter(function(x){return x&&x.id===dp.id})[0])});
      st.categories=(Array.isArray(st.categories)?st.categories:[]).filter(function(c){return c&&c.name});
      data.products.forEach(function(p){if(p.category&&!st.categories.some(function(c){return c.name.toLowerCase()===p.category.toLowerCase()}))st.categories.push({name:p.category,show:true})});
      $("banner").hidden=saved;
      $("login").hidden=true;$("app").hidden=false;
      setDirty(false);openId=null;render();
    });
  }

  /* ---------- products ---------- */
  function thumb(p){var u=imgs(p)[0];return u?'<img class="thumb" src="'+esc(src(u))+'" alt="">':'<div class="thumb">بدون صورة</div>'}
  function galleryHtml(p){
    var g=imgs(p).map(function(u,i){
      return '<div class="gi"><img class="gthumb" src="'+esc(src(u))+'" alt="">'+
        (i===0?'<span class="main">الرئيسية</span>':'<button type="button" class="ghost" data-g="main" data-i="'+i+'">خليها الرئيسية</button>')+
        '<button type="button" class="ghost danger" data-g="del" data-i="'+i+'">حذف</button></div>'}).join("");
    var add=imgs(p).length<MAXIMG?'<label class="ghost filebtn" for="f-img">+ إضافة صور</label><input id="f-img" class="file" type="file" accept="image/*" multiple data-img="1">':'<p class="hint">وصلت للحد الأقصى ('+MAXIMG+' صور).</p>';
    return '<div class="gal">'+g+'</div>'+add+'<p class="hint">أول صورة هي اللي بتظهر على كارت المنتج. تقدر تختار أكتر من صورة مرة واحدة، وبتتصغّر تلقائيًا قبل الرفع.</p>';
  }
  function priceSub(p){
    var c=esc(data.store.currency);
    return p.salePrice>0&&p.salePrice<p.price?'<s>'+esc(p.price)+'</s> <b class="gold">'+esc(p.salePrice)+'</b> '+c+' <span class="gold">(-'+Math.round((1-p.salePrice/p.price)*100)+'%)</span>':'<b>'+esc(p.price)+'</b> '+c;
  }
  function catSelect(p){
    var names=data.store.categories.map(function(c){return c.name});
    if(p.category&&names.indexOf(p.category)<0)names.push(p.category);
    return '<select id="f-cat" class="ltr" data-f="category">'+names.map(function(n){return '<option value="'+esc(n)+'"'+(n===p.category?' selected':'')+'>'+esc(n)+'</option>'}).join("")+'</select>';
  }
  function rowHtml(p){
    var open=p.id===openId,confirming=p.id===delId,n=imgs(p).length;
    var h='<li class="prow" data-id="'+esc(p.id)+'"><div class="head">'+thumb(p)+
      '<div class="meta"><strong data-s="name">'+esc(p.name||"(بدون اسم)")+'</strong><span class="sub"><span data-s="cat" class="ltr">'+esc(p.category)+'</span><span class="ltr" data-s="prices">'+priceSub(p)+'</span><span>'+n+' صور</span></span></div>'+
      '<div class="flags"><label><input type="checkbox" data-k="visible"'+(p.visible!==false?" checked":"")+'> ظاهر في الموقع</label><label><input type="checkbox" data-k="soldOut"'+(p.soldOut?" checked":"")+'> نفدت الكمية</label></div>'+
      '<div class="acts"><button type="button" class="ghost" data-act="edit">'+(open?"إغلاق":"تعديل")+'</button>'+
      '<button type="button" class="ghost" data-act="up" aria-label="نقل لفوق">&uarr;</button><button type="button" class="ghost" data-act="down" aria-label="نقل لتحت">&darr;</button>'+
      '<button type="button" class="ghost danger" data-act="del">'+(confirming?"تأكيد الحذف؟":"حذف")+'</button></div></div>';
    if(open){
      h+='<div class="form">'+
        '<div class="f"><label for="f-name">اسم المنتج (بالإنجليزي)</label><input id="f-name" type="text" class="ltr" data-f="name" value="'+esc(p.name)+'"></div>'+
        '<div class="f"><label for="f-cat">القسم</label>'+catSelect(p)+'<p class="hint">الأقسام بتتعدل من تبويب "الأقسام والخصومات".</p></div>'+
        '<div class="f"><label for="f-price">السعر ('+esc(data.store.currency)+')</label><input id="f-price" type="number" min="0" step="1" class="ltr" data-f="price" value="'+esc(p.price)+'"></div>'+
        '<div class="f"><label for="f-sale">سعر بعد الخصم (اختياري)</label><input id="f-sale" type="number" min="0" step="1" class="ltr" data-f="salePrice" value="'+esc(p.salePrice||0)+'"><p class="hint">سيبه 0 لو مفيش خصم. لازم يكون أقل من السعر الأصلي.</p></div>'+
        '<div class="f wide"><label for="f-desc">وصف قصير (بالإنجليزي)</label><textarea id="f-desc" class="ltr" data-f="desc">'+esc(p.desc)+'</textarea></div>'+
        '<div class="f wide"><label for="f-inc">لو ده باندل: بيشمل إيه؟ (اختياري)</label><input id="f-inc" type="text" class="ltr" data-f="includes" placeholder="Ring + Chain + Bracelet" value="'+esc(p.includes||"")+'"><p class="hint">مثال: باندل فيه خاتم وسلسلة وإنسيال. اعمله منتج عادي، اختار له قسم Bundles، وحط له صور وسعر (وسعر خصم لو عايز). السطر ده بيظهر للعميل تحت الوصف.</p></div>'+
        '<div class="f wide"><label>صور المنتج</label>'+galleryHtml(p)+'</div></div>';
    }
    return h+'</li>';
  }
  function renderProducts(){
    $("plist").innerHTML=data.products.length?data.products.map(rowHtml).join(""):'<li class="banner">مفيش منتجات لسه. دوس "منتج جديد" وابدأ.</li>';
  }
  function byId(id){return data.products.filter(function(p){return p.id===id})[0]}

  $("plist").addEventListener("click",function(e){
    var g=e.target.closest("button[data-g]");
    if(g){
      var p0=byId(g.closest(".prow").dataset.id),i0=Number(g.dataset.i),im=imgs(p0);

  /* ---------- images ---------- */
  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),im=new Image();
      im.onload=function(){
        var s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){b?res(b):rej(new Error("مقدرتش أقرأ الصورة دي."))},"image/jpeg",0.86);
      };
      im.onerror=function(){rej(new Error("الملف ده مش صورة مدعومة. جرّب JPG أو PNG."))};
      im.src=url;
    });
  }
  function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=rej;r.readAsDataURL(blob)})}
  function upload(file){
    return shrink(file).then(b64).then(function(d){return api("/api/upload",{name:file.name,data:d})}).then(function(r){
      if(r.status===401){backToLogin("انتهت الجلسة. ادخل كلمة السر تاني.");throw new Error("انتهت الجلسة")}
      if(r.status!==200||!r.body.url)throw new Error("الصورة ما اترفعتش: "+(r.body.error||"خطأ غير معروف")+". اتأكد إن Blob متفعّل على Vercel.");
      return r.body.url;
    });
  }
  // Uploads files one after another; each finished upload is handed to onUrl.
  function uploadMany(files,onUrl){
    var done=0;
    return files.reduce(function(chain,f,i){
      return chain.then(function(){
        toast("بنرفع الصورة "+(i+1)+" من "+files.length+"...");
        return upload(f).then(function(u){onUrl(u);done++}).catch(function(err){toast(err.message,true)});
      });
    },Promise.resolve()).then(function(){if(done)toast(done===1?"الصورة اترفعت. افتكر تدوس حفظ.":"اترفع "+done+" صور. افتكر تدوس حفظ.")});
  }

  $("ship").addEventListener("input",function(e){
    var t=e.target,s=data.store;
    if(t.dataset.free){s.freeShippingOver=Math.max(0,Math.round(Number(t.value)||0));setDirty(true)}
    if(t.dataset.ship){s.shipping[t.closest(".r").dataset.gid]=Math.max(0,Math.round(Number(t.value)||0));setDirty(true)}
    if(t.dataset.pf&&t.type!=="checkbox"){var p=s.payments.filter(function(x){return x.id===t.closest(".payc").dataset.pid})[0];p[t.dataset.pf]=t.value;setDirty(true)}
  });
  $("ship").addEventListener("change",function(e){
    var t=e.target,s=data.store;
    if(t.dataset.noship){
      var id=t.closest(".r").dataset.gid;
      s.shipping[id]=t.checked?null:(DEF.store.shipping[id]||0);setDirty(true);renderShip();
    }
    if(t.dataset.pf==="enabled"){var p=s.payments.filter(function(x){return x.id===t.closest(".payc").dataset.pid})[0];p.enabled=t.checked;setDirty(true)}
  });
  $("ship").addEventListener("click",function(e){
    if(!e.target.dataset.shall)return;
    var v=$("sh-all").value;
    if(v===""||!(Number(v)>=0)){toast("اكتب السعر الأول.",true);return}
    var n=Math.round(Number(v));EGYPT.forEach(function(g){data.store.shipping[g.id]=n});
    setDirty(true);renderShip();toast("اتحط "+n+" لكل المحافظات. دوس حفظ.");
  });

  /* ---------- tabs, save, boot ---------- */
  var TABS={products:["tabP","viewP",renderProducts],cats:["tabD","viewD",renderCats],ship:["tabH","viewH",renderShip],look:["tabL","viewL",renderLook],settings:["tabS","viewS",renderSettings]};
  function render(){
    Object.keys(TABS).forEach(function(k){var t=TABS[k];$(t[0]).setAttribute("aria-pressed",tab===k);$(t[1]).hidden=tab!==k});
    TABS[tab][2]();
  }
  Object.keys(TABS).forEach(function(k){$(TABS[k][0]).onclick=function(){tab=k;render()}});

  $("save").addEventListener("click",function(){
    if(data.products.some(function(p){return !String(p.name).trim()})){toast("اكتب اسم لكل منتج قبل الحفظ.",true);return}
    var bad=data.products.filter(function(p){return p.salePrice>0&&p.salePrice>=p.price})[0];
    if(bad){toast("سعر الخصم لازم يكون أقل من السعر الأصلي في: "+bad.name,true);return}
    $("save").disabled=true;toast("بنحفظ...");
    api("/api/save",{store:data.store,products:data.products}).then(function(r){
      if(r.status===401){backToLogin("انتهت الجلسة. ادخل كلمة السر تاني.");return}
      if(r.status!==200){setDirty(true);toast("الحفظ فشل: "+(r.body.error||"خطأ غير معروف")+". اتأكد إن Blob متفعّل على Vercel.",true);return}
      setDirty(false);$("banner").hidden=true;toast("اتحفظ. التعديلات هتظهر في الموقع خلال حوالي دقيقة.");
    }).catch(function(){setDirty(true);toast("مفيش اتصال بالإنترنت. جرّب تاني.",true)});
  });
  $("logout").onclick=function(){try{sessionStorage.removeItem("bracelet-admin")}catch(e){}location.reload()};
  window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});

  if(pw){login(pw).then(enter).catch(function(){backToLogin("")})}
})();
</script>
</body>
</html>
